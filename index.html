    title="TFMRC SOA Portal"
    allow="clipboard-read; clipboard-write; fullscreen"
    referrerpolicy="no-referrer-when-downgrade"></iframe>

  <script>
    var APP_URL = "https://script.google.com/macros/s/AKfycbyACRDc26Of94JrsG2rnF9JUGxTyKXLnN216W8VylfjBh1OnvS3sW5jQkXvRmFeI1pG9g/exec";
    // Auto log-in: pass the one-time pass from the TFMRC Portal (?sso=...) to the app,

    var sso = new URLSearchParams(location.search).get('sso');
    document.getElementById('app').src = APP_URL + (sso ? '?sso=' + encodeURIComponent(sso) : '');

    var boot = document.getElementById('boot');
    document.getElementById('app').addEventListener('load', function () {
